<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23fff'%3E%26%2310023;%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Xen0 Executor is not released yet.">
  <title>Not Released Yet — Xen0 Executor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b16;
      color: #f6f5ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #a5a5bd;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(92, 58, 173, .32), transparent 40%),
        radial-gradient(ellipse at 85% 78%, rgba(26, 127, 173, .20), transparent 38%),
        linear-gradient(135deg, #090b16 0%, #111025 52%, #09131c 100%);
    }

    .notice-card {
      width: min(100%, 470px);
      padding: clamp(28px, 6vw, 44px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      text-align: center;
      animation: rise .7s cubic-bezier(.2,.75,.25,1) both;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(167,139,250,.36), rgba(240,171,252,.13));
      color: #fff;
      font-size: 20px;
      box-shadow: 0 8px 25px rgba(167,139,250,.17);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 36px);
      letter-spacing: -.04em;
      line-height: 1.15;
      background: linear-gradient(100deg, #c4b5fd, #f0abfc 60%, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { margin: 13px 0 25px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .back-home {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: #f6f5ff;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .back-home:hover { transform: translateY(-2px); background: rgba(255,255,255,.15); }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="notice-card">
    <div class="brand-mark" aria-hidden="true">&#10023;</div>
    <h1>Not Released Yet</h1>
    <p>Xen0 Executor isn’t available for download just yet. Please check back later.</p>
    <button class="back-home" type="button" onclick="window.location.href='../'">← Back to home</button>
  </main>
</body>
</html>

permalink: /login/
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23fff'%3E%26%2310023%3B%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Log in to your account.">
  <title>Log in to your account</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b16;
      color: #f6f5ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #a5a5bd;
      --line: rgba(255, 255, 255, .12);
      --purple: #a78bfa;
      --pink: #f0abfc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(92, 58, 173, .32), transparent 40%),
        radial-gradient(ellipse at 85% 78%, rgba(26, 127, 173, .20), transparent 38%),
        linear-gradient(135deg, #090b16 0%, #111025 52%, #09131c 100%);
    }

    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .38;
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate;
    }

    body::before { top: 8%; left: 8%; background: #7447dc; }
    body::after { right: 8%; bottom: 5%; background: #168bb0; animation-delay: -4s; }

    .login-card {
      width: min(100%, 470px);
      padding: clamp(28px, 6vw, 44px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      animation: rise .7s cubic-bezier(.2,.75,.25,1) both;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(167,139,250,.36), rgba(240,171,252,.13));
      color: #fff;
      font-size: 20px;
      box-shadow: 0 8px 25px rgba(167,139,250,.17);
    }

    h1 { margin: 0; font-size: clamp(28px, 5vw, 34px); letter-spacing: -.04em; line-height: 1.15; }
    .gradient-text {
      color: var(--purple);
      background: linear-gradient(100deg, #c4b5fd, #f0abfc 60%, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intro { margin: 11px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    form { display: grid; gap: 17px; }
    .field { display: grid; gap: 8px; }
    label, .label-row { color: #e8e7f3; font-size: 13px; font-weight: 600; }
    .label-row { display: flex; justify-content: space-between; align-items: center; }
    .input-wrap { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 12px;
      outline: none;
      background: rgba(7, 8, 19, .42);
      color: #fff;
      font: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: #77778e; }
    input:focus { border-color: rgba(192, 168, 255, .8); background: rgba(7, 8, 19, .62); box-shadow: 0 0 0 3px rgba(167,139,250,.14); }
    .input-wrap input { padding-right: 72px; }
    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      padding: 5px;
      background: transparent;
      color: #c4b5fd;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .show-password:hover, .text-link:hover { color: #fff; }
    .text-link { color: #c4b5fd; text-decoration: none; font-size: 12px; font-weight: 600; }

    .options { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .remember { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; cursor: pointer; }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: #a78bfa; }

    .submit-button {
      min-height: 49px;
      margin-top: 2px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: linear-gradient(105deg, #8b5cf6, #c084fc 55%, #a78bfa);
      box-shadow: 0 8px 24px rgba(139,92,246,.24);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, filter .2s;
    }
    .submit-button:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 12px 30px rgba(139,92,246,.35); }
    .submit-button:active { transform: translateY(0); }
    .message { display: none; padding: 12px 14px; border: 1px solid rgba(74,222,128,.3); border-radius: 11px; background: rgba(34,197,94,.1); color: #bbf7d0; font-size: 13px; line-height: 1.5; }
    .message.visible { display: block; }
    .error-message { margin: -5px 0 0; color: #fda4af; font-size: 12px; }
    .signup { margin: 23px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .signup a { color: #c4b5fd; text-decoration: none; }
    .signup a:hover { text-decoration: underline; }
    .back-home { display: block; margin-top: 17px; color: #89899f; font-size: 12px; text-align: center; text-decoration: none; }
    .back-home:hover { color: #fff; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -20px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <h1>Welcome <span class="gradient-text">back</span></h1>
    <p class="intro">Log in to continue to your account.</p>

    <div id="success-message" class="message" role="status" aria-live="polite"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-identifier">Email or username</label>
        <input id="login-identifier" name="identifier" type="text" placeholder="you@example.com or username" autocomplete="username" required>
      </div>
      <div class="field">
        <div class="label-row">
          <label for="password">Password</label>
          <a class="text-link" href="mailto:support@example.com?subject=Password%20reset">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>
      </div>
      <p class="error-message" id="form-error" role="alert" hidden></p>
      <button class="submit-button" type="submit">Log in</button>
    </form>
    <p class="signup">Don’t have an account? <a href="../sign-up/">Create an account</a></p>
    <a class="back-home" href="./">← Back to home</a>
  </main>

  <script>
    const password = document.getElementById('password');
    const showPasswordButton = document.querySelector('.show-password');

    showPasswordButton.addEventListener('click', () => {
      const isHidden = password.type === 'password';
      password.type = isHidden ? 'text' : 'password';
      showPasswordButton.textContent = isHidden ? 'Hide' : 'Show';
      showPasswordButton.setAttribute('aria-label', `${isHidden ? 'Hide' : 'Show'} password`);
      showPasswordButton.setAttribute('aria-pressed', String(isHidden));
    });


  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAEpolGgoosGDg-Wf2o849HHl4jm1-Ngyc",
      authDomain: "xen0-executor.firebaseapp.com",
      projectId: "xen0-executor",
      storageBucket: "xen0-executor.firebasestorage.app",
      messagingSenderId: "829021934051",
      appId: "1:829021934051:web:1a7edc1f8da77ffdb290d6",
      measurementId: "G-M7CFMPL88L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.querySelector(".show-password");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("form-error");
    const loginSuccess = document.getElementById("success-message");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.hidden = true;
      loginSuccess.classList.remove("visible");

      const identifier = document.getElementById("login-identifier").value.trim();
      const passwordValue = document.getElementById("password").value;

      try {
        let email = identifier;
        if (!identifier.includes("@")) {
          const username = identifier.toLowerCase();
          const usernameSnapshot = await getDoc(doc(db, "usernames", username));
          if (!usernameSnapshot.exists() || !usernameSnapshot.data().email) {
            throw new Error("No account was found for that email or username.");
          }
          email = usernameSnapshot.data().email;
        }

        await signInWithEmailAndPassword(auth, email, passwordValue);
        window.location.assign("../");
      } catch (error) {
        loginError.textContent = error.message;
        loginError.hidden = false;
      }
    });
  </script>
</body>
</html>
